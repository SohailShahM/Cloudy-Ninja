[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

dependencies {
  api "com.badlogicgames.box2dlights:box2dlights:$box2dlightsVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"


  // Serialization for save/load systems
  api "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationVersion"

  // UI improvements
  api "com.kotcrab.vis:vis-ui:$visuiVersion"


  // Testing
  testImplementation "io.kotest:kotest-runner-junit5:$kotestVersion"
  testImplementation "io.kotest:kotest-assertions-core:$kotestVersion"
  testImplementation "io.mockk:mockk:$mockkVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
  useJUnitPlatform()
  // T-079 v2: parallelize test execution across 4 forks. CI runners are 2-core
  // so 4 forks oversubscribes slightly but works well for IO-bound + GC-bound
  // Kotest suites. Locally devs have 8+ cores so this is also a speedup there.
  maxParallelForks = 4
}

// T-078: include the standalone tools/ Kotlin source in the test source set so the
// procedural icon generator can be compiled and invoked without a dedicated gradle
// module. The tool is pure-JDK (BufferedImage + ImageIO) and has no libGDX deps.
sourceSets {
  test {
    kotlin {
      srcDirs += file('../tools')
    }
  }
}

// `./gradlew :core:generateAchievementIcons` (re)generates the 12 achievement PNGs
// under assets/icons/achievements/. Output is deterministic — re-running produces
// byte-identical files.
task generateAchievementIcons(type: JavaExec, dependsOn: testClasses) {
  description = 'Regenerate 16x16 achievement icon PNGs (T-078).'
  group = 'tools'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.sohai.platformer.tools.IconGenerator'
  workingDir = rootDir
  args = ['assets/icons/achievements']
}

