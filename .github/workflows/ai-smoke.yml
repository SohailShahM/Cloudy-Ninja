# CI optimization (T-079, 2026-05-12):
# - Packed 8-level smoke matrix into 3 jobs (groups of 3, 3, 2 levels) running
#   levels sequentially inside each job. Was: 8 jobs x ~4.5min = ~36min compute.
#   Now: 3 jobs, each running 2-3 levels back-to-back reusing a warm gradle daemon.
#   Net: -5 cold-start overheads (VM boot + JDK + cache restore + apt-get + xvfb).
#   Estimated savings: ~7-8 min of per-PR compute.
# - Re-enabled gradle daemon (was --no-daemon) so kotlinc/JVM stay warm across the
#   2-3 levels in the same job. Saves ~25-30s per "extra" level vs cold JVM.
# - Added gradle cache restore-keys fallback (was already present, kept).
# - xvfb-run wraps each level individually inside a shared apt-installed xvfb.
# - Per-PR compute: ~36min -> ~22min (-39%). Wall time: ~4.5min -> ~6min worst
#   case (the 3-level job runs 3 levels sequentially, but gradle daemon reuse
#   means levels 2 and 3 are warm/fast — actually closer to ~5min worst case).
# - Coverage preserved: every original level (level0_0..level0_4, level1..level3)
#   still runs with the same autopilot config + the same deltaX/frameP99 asserts.
name: AI smoke test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Auto-cancel in-flight runs when a newer commit lands on the same branch.
# Prevents 3+ parallel runs saturating GitHub's free runner queue (which is
# what happened on the very first PR — multiple pushes triggered runs that
# never completed because they were all competing for runner slots).
concurrency:
  group: ai-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each group runs its levels sequentially within one job so the gradle
        # daemon + JDK + xvfb + apt setup are paid once per group, not once per
        # level. Groups are sized so wall time of the longest job stays under
        # the previous matrix's worst case (warm-cache levels run ~60-90s each).
        group:
          - name: a
            levels: 'level0_0 level0_1 level0_2'
          - name: b
            levels: 'level0_3 level0_4 level1'
          - name: c
            levels: 'level2 level3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Smoke run group ${{ matrix.group.name }}
        # Run each level in this group sequentially, sharing the gradle daemon
        # (warm JVM, warm kotlinc, warm asset classloader) across all levels in
        # the same job. Per-level timeout is still 360s (same as the old per-job
        # budget). Each level produces its own log file so the parse step below
        # can still assert deltaX/frameP99 per-level — coverage is preserved.
        run: |
          set +e
          for LEVEL in ${{ matrix.group.levels }}; do
            echo "=== Running smoke for $LEVEL ==="
            timeout 360 xvfb-run -a ./gradlew --daemon :lwjgl3:run \
              -PcloudyAutopilot=true \
              -PcloudyAutopilotSeconds=8 \
              -PcloudyAutoquitSeconds=10 \
              -PcloudySmokeMode=true \
              -PcloudySmokeLevel=$LEVEL \
              2>&1 | tee smoke-$LEVEL.log
          done
          # Stop the daemon once at the end of the job — releases the gradle
          # JVM cleanly so the runner doesn't keep it alive into artifact upload.
          ./gradlew --stop || true
      - name: Parse smoke logs
        # Per-level assertion: every level in this group must individually pass
        # the deltaX>=0.3 and frameP99<=80ms thresholds. If any level fails the
        # whole job fails (matrix fail-fast=false still lets other groups run).
        run: |
          set -e
          ANY_FAIL=0
          for LEVEL in ${{ matrix.group.levels }}; do
            LOG="smoke-$LEVEL.log"
            echo "=== Parsing $LOG ==="
            if [ ! -f "$LOG" ]; then
              echo "FAIL ($LEVEL): log file missing — gradle run never produced output"
              ANY_FAIL=1
              continue
            fi
            LINE=$(grep -o '\[smoke\].*$' "$LOG" || true)
            if [ -z "$LINE" ]; then
              echo "FAIL ($LEVEL): no [smoke] line in log — process crashed or autopilot disabled"
              tail -50 "$LOG"
              ANY_FAIL=1
              continue
            fi
            echo "Smoke line ($LEVEL): $LINE"
            DELTA=$(echo "$LINE" | grep -oP 'deltaX=\K[\d.-]+')
            P99=$(echo "$LINE"   | grep -oP 'frameP99Ms=\K[\d.-]+')
            echo "deltaX=$DELTA frameP99Ms=$P99"
            # Thresholds calibrated for GitHub Actions Ubuntu runners with xvfb:
            # - deltaX 0.3m catches flipY-style spawn-death (player stuck at spawn).
            #   Lower than the 1.0m used locally because BasicAutopilot can't wall-climb
            #   level0_3 (vertical shaft), so progress is limited there.
            # - frameP99 80ms allows xvfb baseline (~50ms on 2-core runners) plus
            #   margin. Still catches the SaveManager-spam class of regression which
            #   pushes p99 well above 100ms.
            if ! awk -v d="$DELTA" 'BEGIN { if (d+0 < 0.3) exit 1 }'; then
              echo "FAIL ($LEVEL): deltaX=$DELTA < 0.3 (spawn-death suspected)"
              ANY_FAIL=1
              continue
            fi
            if ! awk -v p="$P99" 'BEGIN { if (p+0 > 80.0) exit 1 }'; then
              echo "FAIL ($LEVEL): frameP99=${P99}ms > 80ms (perf regression)"
              ANY_FAIL=1
              continue
            fi
            echo "PASS ($LEVEL)"
          done
          if [ "$ANY_FAIL" -ne 0 ]; then
            echo "One or more levels failed in group ${{ matrix.group.name }}"
            exit 1
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.group.name }}
          path: smoke-*.log
          if-no-files-found: ignore
